<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <div class="header">
        <h1>Tic-Tac-Toe</h1>
      </div>
      <section class="gameboard">
        <div id="cell-1" class="cell cell-1">&times</div>
        <div id="cell-2" class="cell cell-2">o</div>
        <div id="cell-3" class="cell cell-3"></div>
        <div id="cell-4" class="cell cell-4"></div>
        <div id="cell-5" class="cell cell-5"></div>
        <div id="cell-6" class="cell cell-6"></div>
        <div id="cell-7" class="cell cell-7"></div>
        <div id="cell-8" class="cell cell-8"></div>
        <div id="cell-9" class="cell cell-9"></div>
        <div class="separator separator-one"></div>
        <div class="separator separator-two"></div>
        <div class="separator separator-three"></div>
        <div class="separator separator-four"></div>
      </section>
      <aside class="game-information"></aside>
    </main>
  </body>
</html>
