<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <div class="header">
        <h1>Tic-Tac-Toe</h1>
      </div>
      <section class="gameboard">
        <button
          id="cell-0"
          class="cell cell-0"
          data-row="0"
          data-column="0"
        ></button>
        <button
          id="cell-1"
          class="cell cell-1"
          data-row="0"
          data-column="1"
        ></button>
        <button
          id="cell-2"
          class="cell cell-2"
          data-row="0"
          data-column="2"
        ></button>
        <button
          id="cell-3"
          class="cell cell-3"
          data-row="1"
          data-column="0"
        ></button>
        <button
          id="cell-4"
          class="cell cell-4"
          data-row="1"
          data-column="1"
        ></button>
        <button
          id="cell-5"
          class="cell cell-5"
          data-row="1"
          data-column="2"
        ></button>
        <button
          id="cell-6"
          class="cell cell-6"
          data-row="2"
          data-column="0"
        ></button>
        <button
          id="cell-7"
          class="cell cell-7"
          data-row="2"
          data-column="1"
        ></button>
        <button
          id="cell-8"
          class="cell cell-8"
          data-row="2"
          data-column="2"
        ></button>
        <div class="separator separator-one"></div>
        <div class="separator separator-two"></div>
        <div class="separator separator-three"></div>
        <div class="separator separator-four"></div>
      </section>
      <aside class="game-information">
        <p class="turn"></p>
        <label for="player-one-name">Player One Name:</label>
        <input type="text" id="player-one-name" name="player-one-name" />
        <label for="player-two-name">Player Two Name:</label>
        <input type="text" id="player-two-name" name="player-two-name" />
        <button id="start-button" class="start-button">Start Game</button>
      </aside>
    </main>
  </body>
</html>
